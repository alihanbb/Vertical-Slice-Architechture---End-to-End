name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'
  IMAGE_NAME: projectapi

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build & Test
  # Her push ve pull_request'te çalışır
  # ─────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore VSA/ProjectApi/ProjectApi.csproj

      - name: Build (Release)
        run: dotnet build VSA/ProjectApi/ProjectApi.csproj --no-restore -c Release

      - name: Test
        run: dotnet test VSA/ProjectApi/ProjectApi.csproj --no-build -c Release --verbosity normal
        # Test projesi eklendiğinde otomatik olarak devreye girer
        continue-on-error: true

  # ─────────────────────────────────────────────
  # JOB 2: Docker Build & Push
  # Sadece main branch push'larında çalışır
  # ─────────────────────────────────────────────
  docker-build-and-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./VSA
          file: ./VSA/ProjectApi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 3: SonarCloud Static Analysis
  # Sadece main branch push'larında çalışır
  # Gerekli Secrets: SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORGANIZATION
  # ─────────────────────────────────────────────
  sonarcloud:
    name: 🔍 SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud tam git geçmişini gerektirir

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: SonarCloud — Begin
        run: |
          dotnet sonarscanner begin \
            /k:"${{ secrets.SONAR_PROJECT_KEY }}" \
            /o:"${{ secrets.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml

      - name: Build for SonarCloud
        run: dotnet build VSA/ProjectApi/ProjectApi.csproj -c Release

      - name: Collect Coverage (Test varsa)
        run: |
          dotnet-coverage collect \
            "dotnet test VSA/ProjectApi/ProjectApi.csproj --no-build" \
            -f xml -o coverage.xml
        continue-on-error: true

      - name: SonarCloud — End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
