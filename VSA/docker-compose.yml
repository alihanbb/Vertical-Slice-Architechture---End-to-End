services:
  projectapi:
    image: ${DOCKER_REGISTRY-}projectapi
    build:
      context: .
      dockerfile: ProjectApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Serilog__WriteTo__0__Name=Seq
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:${SEQ_PORT}
    depends_on:
      - sqlserver
      - seq
    ports:
      - "${API_PORT}:8080"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      Seq_FIRSTRUN_ADMINUSERNAME: "${SEQ_ADMIN_USER}"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - seq_data:/data

  sonar_db:
    image: postgres:15-alpine
    container_name: sonar_db
    environment:
      - POSTGRES_USER=${SONAR_DB_USER}
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD}
      - POSTGRES_DB=${SONAR_DB_NAME}
    ports:
      - "${SONAR_DB_PORT}:5432"
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    depends_on:
      - sonar_db
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar_db:${SONAR_DB_PORT}/${SONAR_DB_NAME}
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
    ports:
      - "${SONARQUBE_PORT}:9000"
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp

volumes:
  sqlserver_data:
  jenkins_home:
  seq_data:
  sonar_db_data:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:

